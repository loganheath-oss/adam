<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADAM — Gate Orchestrator</title>
  <style>
    :root {
      --bg:#FFFFFF; --ink:#000000; --ink-mid:#5C5C5C; --rule:#E5E5E5;
      --brand-green:#14A800; --brand-hero:#67DC12; --brand-green-cream:#E0F5C3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PP Neue Montreal', system-ui, sans-serif; font-weight: 400;
      background: var(--bg); color: var(--ink);
      display: flex; flex-direction: column; height: 100vh;
      max-width: 880px; margin: 0 auto;
    }
    header {
      padding: 20px 32px; border-bottom: 2px solid var(--ink);
      display: flex; align-items: baseline; gap: 16px;
    }
    header h1 { font-size: 28px; letter-spacing: 0.04em; }
    header .meta { font-size: 11px; color: var(--ink-mid); letter-spacing: 0.1em; text-transform: uppercase; }
    #log {
      flex: 1; overflow-y: auto; padding: 24px 32px; display: flex; flex-direction: column; gap: 16px;
    }
    .msg { padding: 12px 16px; border-radius: 8px; line-height: 1.5; }
    .msg.user { background: var(--brand-green-cream); border-left: 3px solid var(--brand-green); }
    .msg.assistant { background: #f8f8f8; border-left: 3px solid var(--ink); white-space: pre-wrap; }
    .tool { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-mid);
            background: #fafafa; border: 1px solid var(--rule); border-radius: 6px;
            padding: 8px 12px; max-height: 200px; overflow-y: auto; }
    .tool .name { color: var(--brand-green); font-weight: 700; }
    form { display: flex; gap: 12px; padding: 16px 32px 28px; border-top: 1px solid var(--rule); }
    input[type="text"] {
      flex: 1; font: inherit; font-size: 15px; padding: 12px 16px;
      border: 1px solid var(--rule); border-radius: 999px; background: #fff;
    }
    input[type="text"]:focus { outline: none; border-color: var(--brand-green); }
    button {
      font: inherit; font-size: 14px; padding: 12px 24px; border: none;
      background: var(--ink); color: #fff; border-radius: 999px; cursor: pointer;
    }
    button:hover { background: var(--brand-green); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>ADAM</h1>
    <span class="meta">Gate Orchestrator · /chat/ui</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Ask about a sprint, or paste a sprint_id…" autocomplete="off" autofocus>
    <button type="submit" id="send">Send</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

const history = []; // [{role, content}]

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function appendMsg(role, text) {
  const div = el('div', `msg ${role}`, text);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function appendTool(name, payload) {
  const div = el('div', 'tool');
  const head = el('span', 'name', name);
  div.appendChild(head);
  div.appendChild(document.createTextNode(' · '));
  div.appendChild(document.createTextNode(JSON.stringify(payload).slice(0, 400)));
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function sendTurn(userText) {
  history.push({ role: 'user', content: userText });
  appendMsg('user', userText);
  sendBtn.disabled = true;

  const assistantDiv = appendMsg('assistant', '');
  let assistantText = '';

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        let ev;
        try { ev = JSON.parse(data); } catch { continue; }
        if (ev.type === 'text_delta') {
          assistantText += ev.text;
          assistantDiv.textContent = assistantText;
          log.scrollTop = log.scrollHeight;
        } else if (ev.type === 'tool_use') {
          appendTool(ev.name + '(…)', ev.input);
        } else if (ev.type === 'tool_result') {
          let content = ev.content;
          try { content = JSON.parse(content); } catch {}
          appendTool('→ result', content);
        } else if (ev.type === 'error') {
          assistantDiv.textContent += `\n[error] ${ev.error}`;
        }
      }
    }

    if (assistantText) {
      history.push({ role: 'assistant', content: assistantText });
    }
  } catch (e) {
    assistantDiv.textContent = `[error] ${e.message}`;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendTurn(text);
});
</script>
</body>
</html>
