<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADAM — __SPRINT_ID__</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f9fafb;
    color: #111827;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .nav {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 48px;
    flex-shrink: 0;
  }
  .nav-logo { font-weight: 700; font-size: 14px; letter-spacing: 0.05em; color: #14a800; }
  .nav-sprint { font-size: 12px; color: #6b7280; font-family: monospace; }
  .nav a { font-size: 12px; color: #6b7280; text-decoration: none; padding: 3px 8px; border-radius: 4px; margin-left: auto; }
  .nav a:hover { background: #f3f4f6; color: #111; }

  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* ── Left: chat ── */
  .chat-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid #e5e7eb;
    background: #fff;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .message {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.12s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .avatar-adam { background: #14a800; color: #fff; }
  .avatar-user { background: #1c1b18; color: #fff; }
  .avatar-system { background: #e5e7eb; color: #6b7280; }

  .bubble {
    flex: 1;
    min-width: 0;
  }
  .bubble-name {
    font-size: 11px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 3px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .bubble-text {
    font-size: 13.5px;
    line-height: 1.6;
    color: #111827;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble-text.streaming::after {
    content: '▋';
    animation: blink 0.7s step-end infinite;
    color: #14a800;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .tool-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    color: #6b7280;
    font-family: monospace;
    margin: 3px 0;
  }
  .tool-pill.running { background: #fef9c3; border-color: #fde047; color: #854d0e; }
  .tool-pill.done { background: #dcfce7; border-color: #86efac; color: #166534; }
  .pipe-line { padding: 5px 0; font-size: 13px; line-height: 1.5; color: #6b7280; }
  .pipe-line.active { color: #1a1a1a; font-weight: 500; }
  .pipe-line .icon { display: inline-block; width: 14px; text-align: center; margin-right: 6px; color: #10b981; font-weight: 700; }
  .pulse-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #14a800; margin-right: 4px; vertical-align: middle;
    animation: pulse-glow 1s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(20,168,0,.7); opacity: 1; }
    50% { box-shadow: 0 0 0 6px rgba(20,168,0,0); opacity: .6; }
  }
  .pipe-progress {
    margin-top: 6px; margin-left: 20px; height: 6px; background: #f3f4f6;
    border-radius: 4px; overflow: hidden; position: relative;
  }
  .pipe-progress-fill {
    height: 100%; background: linear-gradient(90deg, #14a800, #10b981);
    border-radius: 4px; transition: width 0.5s linear;
  }
  .pipe-progress-fill.indeterminate {
    width: 30% !important; background: linear-gradient(90deg, transparent, #14a800, transparent);
    animation: indet-slide 1.5s ease-in-out infinite;
  }
  @keyframes indet-slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }
  .pipe-meta {
    margin-top: 4px; margin-left: 20px; font-size: 11px; color: #9ca3af;
    display: flex; justify-content: space-between;
  }
  .pipe-meta .eta { color: #6b7280; font-weight: 500; }
  .pipe-meta .eta.overtime { color: #d97706; }

  /* quick actions */
  .quick-bar {
    padding: 8px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    border-top: 1px solid #f3f4f6;
    background: #fafafa;
  }
  .quick-btn {
    padding: 4px 12px;
    font-size: 12px;
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 20px;
    cursor: pointer;
    color: #374151;
    transition: all 0.1s;
    white-space: nowrap;
  }
  .quick-btn:hover { background: #f3f4f6; border-color: #9ca3af; }
  .quick-btn.primary { background: #14a800; color: #fff; border-color: #14a800; }
  .quick-btn.primary:hover { background: #128400; }
  .quick-btn.gate-ready {
    box-shadow: 0 0 0 0 rgba(20,168,0,0.6);
    animation: gate-pulse 1.6s ease-out infinite;
  }
  @keyframes gate-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(20,168,0,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(20,168,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(20,168,0,0); }
  }

  /* input */
  .input-row {
    display: flex;
    gap: 8px;
    padding: 12px 20px 16px;
    background: #fff;
    border-top: 1px solid #e5e7eb;
  }
  .input-row textarea {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 13.5px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
    overflow-y: auto;
    transition: border-color 0.15s;
  }
  .input-row textarea:focus { border-color: #14a800; }
  .send-btn {
    padding: 9px 16px;
    background: #14a800;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-end;
    transition: background 0.1s;
  }
  .send-btn:hover { background: #128400; }
  .send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

  /* ── Right: gates panel ── */
  .gates-col {
    width: 240px;
    flex-shrink: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .gates-header {
    padding: 16px 16px 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b7280;
    border-bottom: 1px solid #f3f4f6;
  }

  .gate-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid #f9fafb;
    transition: background 0.1s;
    cursor: default;
  }
  .gate-item.current { background: #f0fdf4; }

  .gate-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    font-size: 11px;
    font-weight: 700;
  }
  .gate-icon.done { background: #14a800; color: #fff; }
  .gate-icon.current { background: #14a800; color: #fff; animation: pulse-ring 1.6s ease-out infinite; }
  .gate-icon.pending { background: #e5e7eb; color: #9ca3af; }
  .gate-icon.error { background: #dc2626; color: #fff; }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(20,168,0,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(20,168,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(20,168,0,0); }
  }

  .gate-label {
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    line-height: 1.3;
  }
  .gate-label.done { color: #166534; }
  .gate-label.current { color: #14a800; }
  .gate-label.pending { color: #9ca3af; }
  .gate-sublabel {
    font-size: 10px;
    color: #9ca3af;
    margin-top: 2px;
  }

  .sprint-meta {
    padding: 16px;
    border-top: 1px solid #f3f4f6;
    margin-top: auto;
  }
  .sprint-meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #9ca3af;
    margin-bottom: 4px;
  }
  .sprint-meta-val { color: #374151; font-weight: 500; }
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-logo">ADAM</span>
  <span class="nav-sprint">__SPRINT_ID__</span>
  <a href="/sprints">← All sprints</a>
</nav>

<div class="workspace">

  <!-- Chat -->
  <div class="chat-col">
    <div class="messages" id="messages"></div>

    <div class="quick-bar" id="quick-bar">
      <button class="quick-btn" onclick="sendQuick('What gate are we at?')">Status</button>
      <button class="quick-btn" onclick="sendQuick('Show me the copy concepts')">Show copy</button>
      <button class="quick-btn" onclick="sendQuick('Show me the image prompts')">Show prompts</button>
      <button class="quick-btn primary" id="approve-btn" onclick="sendQuick('approve')" style="display:none">✓ Approve gate</button>

    </div>

    <div class="input-row">
      <textarea id="input" placeholder="Message ADAM…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>

    </div>
  </div>

  <!-- Gates panel -->
  <div class="gates-col">
    <div class="gates-header">Pipeline Gates</div>
    <div id="gates-list">
      <div class="gate-item" id="gate-2-item">
        <div class="gate-icon pending" id="gate-2-icon">2</div>
        <div>
          <div class="gate-label pending" id="gate-2-label">Order + Refs</div>

      </div>

        <div class="gate-icon pending" id="gate-3-icon">3</div>
        <div>
          <div class="gate-label pending" id="gate-3-label">Copy</div>
          <div class="gate-sublabel">Ad copy concepts</div>
        </div>
      </div>
      <div class="gate-item" id="gate-4-item">
        <div class="gate-icon pending" id="gate-4-icon">4</div>
        <div>
          <div class="gate-label pending" id="gate-4-label">Image Prompts</div>
          <div class="gate-sublabel">Visual direction scan</div>
        </div>

        <div class="gate-icon pending" id="gate-6-icon">6</div>

    <div class="sprint-meta" id="sprint-meta">
      <div class="sprint-meta-row"><span>State</span><span class="sprint-meta-val" id="meta-state">—</span></div>
      <div class="sprint-meta-row"><span>Driver</span><span class="sprint-meta-val" id="meta-driver">—</span></div>
      <div class="sprint-meta-row"><span>Platform</span><span class="sprint-meta-val" id="meta-platform">—</span></div>
    </div>
  </div>
</div>

<script>
const SPRINT_ID = '__SPRINT_ID__';
const STREAM_URL = `/sprints/${SPRINT_ID}/chat/stream`;
const STATE_URL  = `/api/sprints/${SPRINT_ID}`;

let history = [];   // [{role, content}]
let streaming = false;
let statePoller = null;

// ── Gate state rendering ──────────────────────────────────────────────────────

const GATE_NUMS = [2, 3, 4, 5, 6];

// Returns which gate number is currently open, or null
function gateFromState(state) {
  if (!state) return null;
  const m = state.match(/awaiting_gate_(\d+)/);
  return m ? parseInt(m[1]) : null;
}

function updateGates(sprintState) {
  const raw = (sprintState || '').toLowerCase();
  const currentGate = gateFromState(raw);
  const isComplete = raw === 'complete';
  const isError = raw === 'error' || raw.includes('interrupted');
  const isRunning = raw === 'running' || raw === 'queued';

  GATE_NUMS.forEach(n => {
    const icon  = document.getElementById(`gate-${n}-icon`);
    const label = document.getElementById(`gate-${n}-label`);
    const item  = document.getElementById(`gate-${n}-item`);
    if (!icon) return;

    let iconClass, labelClass, itemClass = '';

    if (isError && currentGate === n) {
      iconClass = 'error'; labelClass = 'error';
    } else if (isComplete || (currentGate && n < currentGate)) {
      iconClass = 'done'; labelClass = 'done';
      icon.textContent = '✓';
    } else if (currentGate === n || (isRunning && n === 2)) {
      iconClass = 'current'; labelClass = 'current'; itemClass = 'current';
    } else {
      iconClass = 'pending'; labelClass = 'pending';
      icon.textContent = n;
    }

    icon.className  = `gate-icon ${iconClass}`;
    label.className = `gate-label ${labelClass}`;
    item.className  = `gate-item ${itemClass}`;
  });

  // Show approve + show-artifact buttons only when a gate is waiting.
  const approveBtn = document.getElementById('approve-btn');
  const showBtn = document.getElementById('show-artifact-btn');
  if (currentGate) {
    approveBtn.textContent = `✓ Approve gate ${currentGate}`;
    approveBtn.style.display = 'inline-block';
    approveBtn.classList.add('gate-ready');
    if (showBtn) showBtn.style.display = 'inline-block';
  } else {
    approveBtn.style.display = 'none';
    approveBtn.classList.remove('gate-ready');
    if (showBtn) showBtn.style.display = 'none';
  }
}

async function pollState() {
  try {
    const r = await fetch(STATE_URL);
    if (!r.ok) return;
    const d = await r.json();
    const s = d.state || '';
    document.getElementById('meta-state').textContent = s || '—';
    document.getElementById('meta-driver').textContent = d.driver || '—';
    document.getElementById('meta-platform').textContent = d.platform || '—';
    updateGates(s);
  } catch (_) {}
}

// ── Message rendering ─────────────────────────────────────────────────────────

function addMessage(role, text) {
  const msgs = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'message';

  const isAdam = role === 'assistant';
  const isUser = role === 'user';
  const avatarClass = isAdam ? 'avatar-adam' : isUser ? 'avatar-user' : 'avatar-system';
  const avatarText  = isAdam ? 'A' : isUser ? 'U' : '·';
  const name        = isAdam ? 'ADAM' : isUser ? 'You' : 'System';

  el.innerHTML = `
    <div class="avatar ${avatarClass}">${avatarText}</div>
    <div class="bubble">
      <div class="bubble-name">${name}</div>
      <div class="bubble-text">${escHtml(text)}</div>
    </div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el.querySelector('.bubble-text');
}

function addToolPill(name, state) {
  const msgs = document.getElementById('messages');
  const pill = document.createElement('div');
  pill.className = `tool-pill ${state}`;
  pill.id = `tool-${name}-${Date.now()}`;
  pill.textContent = `⚙ ${name}`;
  msgs.appendChild(pill);
  msgs.scrollTop = msgs.scrollHeight;
  return pill;
}

function escHtml(t) {
  return String(t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}

// ── Sending ───────────────────────────────────────────────────────────────────

async function sendMessage() {
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if (!text || streaming) return;
  inp.value = '';
  autoResize(inp);
  doSend(text);
}

function sendQuick(text) {
  if (streaming) return;
  doSend(text);
}

async function doSend(text, opts) {
  opts = opts || {};
  streaming = true;
  setSendEnabled(false);

  if (!opts.hidden) {
    addMessage('user', text);
  }
  history.push({ role: 'user', content: text });

  // Streaming assistant bubble — get reference directly (do NOT use id, which
  // would collide with prior streaming bubbles still in the DOM).
  const msgs = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'message';
  el.innerHTML = `
    <div class="avatar avatar-adam">A</div>
    <div class="bubble">
      <div class="bubble-name">ADAM</div>
      <div class="bubble-text streaming"></div>
    </div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;

  const bubble = el.querySelector('.bubble-text');
  let fullText = '';
  let lastToolPill = null;

  try {
    const res = await fetch(STREAM_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        if (!part.startsWith('data:')) continue;
        let evt;
        try { evt = JSON.parse(part.slice(5).trim()); } catch { continue; }

        if (evt.type === 'text') {
          fullText += evt.text;
          bubble.innerHTML = escHtml(fullText);
          bubble.className = 'bubble-text streaming';
          msgs.scrollTop = msgs.scrollHeight;
        } else if (evt.type === 'tool_call') {
          lastToolPill = addToolPill(evt.name, 'running');
        } else if (evt.type === 'tool_result') {
          if (lastToolPill) { lastToolPill.className = 'tool-pill done'; lastToolPill = null; }
          // Refresh gate state after tool calls
          pollState();
        } else if (evt.type === 'done') {
          bubble.className = 'bubble-text';
        } else if (evt.type === 'error') {
          bubble.className = 'bubble-text';
          fullText += `\n⚠ ${evt.message || evt.error || 'Unknown error'}`;
          bubble.innerHTML = escHtml(fullText);
        }
      }
    }
  } catch (err) {
    bubble.className = 'bubble-text';
    fullText = fullText || `Connection error: ${err.message}`;
    bubble.innerHTML = escHtml(fullText);
  }

  bubble.className = 'bubble-text';
  if (fullText) {
    history.push({ role: 'assistant', content: fullText });
  }

  streaming = false;
  setSendEnabled(true);
  pollState();
  // Re-baseline the chat-history cursor from the server (NOT the client clock)
  // so the next poll won't re-render the turn we just streamed, but will
  // still pick up any server-pushed notification that lands after this point.
  try {
    const r = await fetch(`/sprints/${SPRINT_ID}/chat-history`);
    if (r.ok) {
      const data = await r.json();
      const msgs = data.messages || [];
      if (msgs.length) lastChatSeq = msgs[msgs.length - 1].seq ?? lastChatSeq;
    }
  } catch (_) {}

  // After every Claude turn, check if the pipeline is actively processing.
  // If so, open the live narration stream and (when it reaches the next gate)
  // auto-prompt Claude to show the artifacts.
  maybeStartPipelineNarration();
}

// ── Live pipeline narration ───────────────────────────────────────────────────

let pipelineStreaming = false;
let activePipelineES = null;

const ACTIVE_PIPELINE_STATES = new Set([
  'queued', 'running',
  'stage_01_load_refs', 'stage_02_copy_gen', 'stage_03_image_prompts',
  'stage_04_generate_images', 'stage_05_figma_assembly', 'stage_06_deliver',
  'resuming_gate_2', 'resuming_gate_3', 'resuming_gate_4',
  'resuming_gate_5', 'resuming_gate_6',
]);

async function maybeStartPipelineNarration() {
  if (pipelineStreaming || streaming) return;
  let state;
  try {
    const r = await fetch(STATE_URL);
    if (!r.ok) return;
    const d = await r.json();
    state = d.state;
  } catch { return; }
  // Re-check guards AFTER the await — a new chat turn may have started while
  // we were fetching, in which case we must not open a parallel SSE.
  if (pipelineStreaming || streaming) return;
  if (!ACTIVE_PIPELINE_STATES.has(state)) return;
  startPipelineNarration();
}

let progressTicker = null;

function fmtSec(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), r = s % 60;
  return r ? `${m}m ${r}s` : `${m}m`;
}

function startPipelineNarration() {
  if (pipelineStreaming) return;
  pipelineStreaming = true;

  // Live status bubble — looks like ADAM typing.
  const msgs = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'message';
  el.innerHTML = `
    <div class="avatar avatar-adam">A</div>
    <div class="bubble">
      <div class="bubble-name">ADAM · live pipeline</div>
      <div class="bubble-text streaming"></div>
    </div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  const bubble = el.querySelector('.bubble-text');
  // lines: [{ message, eta, startedAt }]
  const lines = [];

  const render = () => {
    const lastIdx = lines.length - 1;
    bubble.innerHTML = lines.map((line, i) => {
      const isActive = i === lastIdx;
      if (!isActive) {
        return `<div class="pipe-line"><span class="icon">✓</span>${escHtml(line.message)}</div>`;
      }
      const elapsed = (Date.now() - line.startedAt) / 1000;
      const eta = line.eta || 0;
      let pct, etaLabel, etaClass = 'eta';
      if (eta > 0) {
        pct = Math.min(95, (elapsed / eta) * 100);
        const remaining = eta - elapsed;
        if (remaining > 0) {
          etaLabel = `~${fmtSec(remaining)} remaining`;
        } else {
          etaLabel = `taking longer than expected (${fmtSec(elapsed)})`;
          etaClass += ' overtime';
          pct = 95;
        }
      } else {
        pct = null;
        etaLabel = `running for ${fmtSec(elapsed)}`;
      }
      const fillClass = pct === null ? 'pipe-progress-fill indeterminate' : 'pipe-progress-fill';
      const fillStyle = pct === null ? '' : `width:${pct}%`;
      return `<div class="pipe-line active">
        <span class="pulse-dot"></span>${escHtml(line.message)}
        <div class="pipe-progress"><div class="${fillClass}" style="${fillStyle}"></div></div>
        <div class="pipe-meta">
          <span>elapsed ${fmtSec(elapsed)}</span>
          <span class="${etaClass}">${etaLabel}</span>
        </div>
      </div>`;
    }).join('');
    msgs.scrollTop = msgs.scrollHeight;
  };

  // Close any prior stream (defensive — shouldn't happen due to guards).
  if (activePipelineES) { try { activePipelineES.close(); } catch {} }
  if (progressTicker) clearInterval(progressTicker);

  const es = new EventSource(`/sprints/${SPRINT_ID}/pipeline-events`);
  activePipelineES = es;
  let finalState = null;

  // Tick every second so the progress bar and countdown update smoothly.
  progressTicker = setInterval(() => { if (lines.length) render(); }, 1000);

  es.onmessage = (ev) => {
    let data;
    try { data = JSON.parse(ev.data); } catch { return; }
    if (data.type === 'status') {
      lines.push({ message: data.message, eta: data.eta_seconds || 0, startedAt: Date.now() });
      render();
    } else if (data.type === 'done') {
      finalState = data.state;
      es.close();
      finishNarration(bubble, lines, finalState);
    }
  };
  es.onerror = () => {
    es.close();
    if (activePipelineES === es) activePipelineES = null;
    if (progressTicker) { clearInterval(progressTicker); progressTicker = null; }
    if (!finalState) {
      lines.push({ message: '(connection to pipeline stream dropped — refresh to reconnect)', eta: 0, startedAt: Date.now() });
      render();
    }
    pipelineStreaming = false;
  };
}

function finishNarration(bubble, lines, finalState) {
  if (progressTicker) { clearInterval(progressTicker); progressTicker = null; }
  // Mark all lines complete — no more progress bar.
  bubble.innerHTML = lines.map(l => `<div class="pipe-line"><span class="icon">✓</span>${escHtml(l.message || l)}</div>`).join('');
  bubble.className = 'bubble-text';
  pipelineStreaming = false;
  pollState();

  // If we reached a gate, automatically re-engage Claude so the user sees the
  // artifacts without having to ping the chat themselves.
  if (typeof finalState === 'string' && finalState.startsWith('awaiting_gate_')) {
    const gateNum = finalState.replace('awaiting_gate_', '');
    const autoPrompt = `[auto] The pipeline just reached ${finalState}. Use the right tool for Gate ${gateNum} (per the gate→tool table in your system prompt) and SHOW me the artifact in plain English right now — do not just announce it, display the contents. End with a clear approve/change prompt.`;
    setTimeout(() => { if (!streaming) doSend(autoPrompt, { hidden: true }); }, 400);
  } else if (finalState === 'complete') {
    const autoPrompt = `[auto] The pipeline just completed. Use get_sprint to fetch the run_summary and available_files, then show me what was delivered.`;
    setTimeout(() => { if (!streaming) doSend(autoPrompt, { hidden: true }); }, 400);
  }
}

function setSendEnabled(on) {
  document.getElementById('send-btn').disabled = !on;
  document.getElementById('input').disabled = !on;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── Boot ──────────────────────────────────────────────────────────────────────

// ── Proactive chat polling ────────────────────────────────────────────────────
// Server writes auto-notifications into chat.jsonl when the pipeline reaches a
// new gate / completes / errors. We poll every 5s and append any messages we
// haven't seen, so the user sees updates without having to ask.

// Use the server-issued monotonic `seq` cursor (line index in chat.jsonl)
// instead of timestamps — that way no clock skew between client and server
// can ever drop a proactive notification.
let lastChatSeq = -1;
let chatPoller = null;

async function pollChatHistory() {
  if (streaming) return;  // never interrupt an in-flight assistant turn
  try {
    const r = await fetch(`/sprints/${SPRINT_ID}/chat-history`);
    if (!r.ok) return;
    const data = await r.json();
    const msgs = data.messages || [];
    if (lastChatSeq < 0) {
      // First call — set baseline to whatever's already on screen.
      lastChatSeq = msgs.length ? (msgs[msgs.length - 1].seq ?? -1) : -1;
      return;
    }
    const fresh = msgs.filter(m => typeof m.seq === 'number' && m.seq > lastChatSeq);
    if (fresh.length) {
      for (const m of fresh) {
        if (!m.role || !m.text) continue;
        addMessage(m.role, m.text);
        history.push({ role: m.role, content: m.text });
        lastChatSeq = m.seq;
      }
      pollState();
    }
  } catch (_) {}
}

async function boot() {
  // Show sprint state immediately
  await pollState();

  // Try to restore prior chat history before bootstrapping.
  let priorMessages = [];
  try {
    const r = await fetch(`/sprints/${SPRINT_ID}/chat-history`);
    if (r.ok) {
      const data = await r.json();
      priorMessages = data.messages || [];
    }
  } catch (_) { /* non-fatal — fall through to bootstrap */ }

  if (priorMessages.length > 0) {
    // Render the prior transcript and seed history for Claude.
    const banner = document.createElement('div');
    banner.style.cssText = 'text-align:center;font-size:11px;color:#9ca3af;padding:8px 0;border-bottom:1px solid #f3f4f6;margin-bottom:8px;';
    banner.textContent = `— Restored ${priorMessages.length} message${priorMessages.length!==1?'s':''} from prior conversation —`;
    document.getElementById('messages').appendChild(banner);
    for (const m of priorMessages) {
      if (!m.role || !m.text) continue;
      addMessage(m.role, m.text);
      history.push({ role: m.role, content: m.text });
    }
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;

    // If the pipeline is mid-run, start narrating it. Otherwise wait for user input.
    maybeStartPipelineNarration();
  } else {
    // Fresh chat — kick off the bootstrap so Claude shows the gate artifact.
    const bootstrap = `I just opened the chat for sprint ${SPRINT_ID}. I have never used this system before and don't know what files or gates exist. Please: (1) fetch the current state of this sprint, (2) figure out which gate is open (if any), (3) fetch the relevant artifact for that gate using the right tool, and (4) show me exactly what I need to approve, in plain English, with the data laid out clearly. End with a clear "reply approve to continue, or tell me what to change" prompt. Do not just tell me a gate is open — show me what's in it.`;
    await doSend(bootstrap);
  }

  // Poll every 10 s while page is open
  statePoller = setInterval(pollState, 10000);

  // Seed the chat-history baseline to whatever's already on screen, then
  // start polling for server-pushed updates every 5 s.
  await pollChatHistory();
  chatPoller = setInterval(pollChatHistory, 5000);
}

// Kick off
window.addEventListener('DOMContentLoaded', boot);
window.addEventListener('beforeunload', () => {
  clearInterval(statePoller);
  if (chatPoller) clearInterval(chatPoller);
  if (progressTicker) clearInterval(progressTicker);
  if (activePipelineES) { try { activePipelineES.close(); } catch {} }
});
</script>
</body>
</html>
