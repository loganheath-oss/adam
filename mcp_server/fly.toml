app = "adam-pipeline-cm"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # Build context is the repo root so the image can copy pipeline/ and runs/
  ignorefile = ".dockerignore"

[env]
  MCP_TRANSPORT = "http"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "runs_data"
  destination = "/app/runs"
  initial_size = "1gb"
